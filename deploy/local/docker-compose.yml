services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ../../prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
      - postgres-exporter-pg-a
      - postgres-exporter-pg-b
      - postgres-exporter-pg-c
      - gcs-backup-exporter

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-project-7e4d63c9-6a51-487b-866}
    volumes:
      - ../../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  postgres-exporter-pg-a:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: ${PG_NODE_1_DSN}
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    ports:
      - "9187:9187"

  postgres-exporter-pg-b:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: ${PG_NODE_2_DSN}
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    ports:
      - "9188:9187"

  postgres-exporter-pg-c:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: ${PG_NODE_3_DSN}
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    ports:
      - "9189:9187"

  gcs-backup-exporter:
    build:
      context: ../../exporters/gcs-backup-exporter
    environment:
      KUBEREATS_ENV: ${KUBEREATS_ENV:-dev}
      KUBEREATS_DB_CLUSTER: ${KUBEREATS_DB_CLUSTER:-kubereats-postgres}
      GCS_BACKUP_BUCKET: ${GCS_BACKUP_BUCKET}
      GCS_BACKUP_PREFIX: ${GCS_BACKUP_PREFIX:-pgbackrest/}
      GCS_BACKUP_MAX_AGE_HOURS: ${GCS_BACKUP_MAX_AGE_HOURS:-26}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    ports:
      - "9817:9817"

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
