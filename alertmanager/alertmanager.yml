global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by:
    - alertname
    - cluster
    - site
    - node
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

inhibit_rules:
  - source_matchers:
      - alertname="KubereatsSiteUnreachable"
      - severity="critical"
    target_matchers:
      - severity=~"warning|info"
    equal:
      - cluster
      - site

receivers:
  - name: default
