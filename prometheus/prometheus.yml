global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    env: dev
    cluster: kubereats-postgres

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          component: prometheus
          node: local

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter-pg-a:9187
        labels:
          component: postgres
          node: pg-a
      - targets:
          - postgres-exporter-pg-b:9187
        labels:
          component: postgres
          node: pg-b
      - targets:
          - postgres-exporter-pg-c:9187
        labels:
          component: postgres
          node: pg-c

  - job_name: patroni
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - file_sd/patroni.yml

  - job_name: db-node-exporter
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - file_sd/db-node-exporter.yml

  - job_name: gcs-backup-exporter
    static_configs:
      - targets:
          - gcs-backup-exporter:9817
        labels:
          component: backup
          node: gcs-backup-exporter
