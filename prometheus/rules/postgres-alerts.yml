groups:
  - name: kubereats-postgres
    rules:
      - alert: KubereatsPostgresExporterDown
        expr: up{job="postgres-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL exporter is down for {{ $labels.node }}"
          description: "Prometheus cannot scrape postgres_exporter for node {{ $labels.node }}. Check exporter container, network path, and PostgreSQL DSN."
          runbook_url: "docs/db-monitoring.md#alert-kubereatspostgresexporterdown"

      - alert: KubereatsPostgresDown
        expr: pg_up{job="postgres-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down or unreachable for {{ $labels.node }}"
          description: "postgres_exporter reached the target but PostgreSQL reported pg_up=0 for node {{ $labels.node }}."
          runbook_url: "docs/db-monitoring.md#alert-kubereatspostgresdown"

      - alert: KubereatsPostgresConnectionsHigh
        expr: sum by (instance, node) (pg_stat_activity_count{datname!~"template.*"}) / max by (instance, node) (pg_settings_max_connections) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection usage is high on {{ $labels.node }}"
          description: "Connection usage has been above 80% of max_connections for 10 minutes. Check connection pools and long-running sessions."
          runbook_url: "docs/db-monitoring.md#alert-kubereatspostgresconnectionshigh"

      - alert: KubereatsPostgresIdleInTransactionHigh
        expr: sum by (instance, node) (pg_stat_activity_count{state="idle in transaction"}) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Many idle-in-transaction sessions on {{ $labels.node }}"
          description: "More than 5 sessions are idle in transaction. These can hold locks and block vacuum."
          runbook_url: "docs/db-monitoring.md#alert-kubereatspostgresidleintransactionhigh"

      - alert: KubereatsPostgresReplicationLagHigh
        expr: pg_replication_lag > 67108864
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL replication lag is high on {{ $labels.node }}"
          description: "Replication lag is above 64 MiB for 10 minutes. Confirm replica health, WAL receiver status, and network path."
          runbook_url: "docs/db-monitoring.md#alert-kubereatspostgresreplicationlaghigh"

      - alert: KubereatsPostgresDeadlocksDetected
        expr: increase(pg_stat_database_deadlocks{datname!~"template.*"}[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL deadlocks detected on {{ $labels.node }}"
          description: "Deadlocks increased in the last 5 minutes. Check application transaction ordering and recent write paths."
          runbook_url: "docs/db-monitoring.md#alert-kubereatspostgresdeadlocksdetected"

      - alert: KubereatsPostgresDatabaseGrowthHigh
        expr: deriv(pg_database_size_bytes{datname!~"template.*"}[6h]) * 86400 > 10737418240
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "PostgreSQL database size is growing quickly on {{ $labels.node }}"
          description: "Projected database growth is above 10 GiB/day based on the last 6 hours. Check ingestion, indexes, and retention."
          runbook_url: "docs/db-monitoring.md#alert-kubereatspostgresdatabasegrowthhigh"

      - alert: KubereatsDbDiskUsageHigh
        expr: (1 - node_filesystem_avail_bytes{job="db-node-exporter",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="db-node-exporter",fstype!~"tmpfs|overlay|squashfs"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DB node disk usage is high on {{ $labels.node }}"
          description: "A DB VM filesystem is above 85% usage. Check PostgreSQL data volume, WAL volume, and backup retention."
          runbook_url: "docs/db-monitoring.md#alert-kubereatsdbdiskusagehigh"

      - alert: KubereatsPatroniNoLeader
        expr: sum(patroni_master{job="patroni"}) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Patroni reports no PostgreSQL leader"
          description: "No Patroni target is reporting itself as leader. Check Patroni API, DCS health, and cluster election state."
          runbook_url: "docs/db-monitoring.md#alert-kubereatspatroninoleader"

      - alert: KubereatsGcsBackupTooOld
        expr: kubereats_gcs_backup_latest_object_age_seconds > kubereats_gcs_backup_max_age_seconds
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Latest GCS PostgreSQL backup is too old"
          description: "The latest observed backup object age is above the configured max age. Check pgBackRest or backup tooling and GCS permissions."
          runbook_url: "docs/db-monitoring.md#alert-kubereatsgcsbackuptooold"

      - alert: KubereatsGcsBackupExporterFailed
        expr: kubereats_gcs_backup_last_check_success == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GCS backup exporter check failed"
          description: "The GCS backup exporter is running but failed its latest bucket listing/check. Check ADC credentials, bucket name, prefix, and network access."
          runbook_url: "docs/db-monitoring.md#alert-kubereatsgcsbackupexporterfailed"
